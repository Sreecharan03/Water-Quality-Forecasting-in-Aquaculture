# PHASE 11 CONTRACT: the sealed final test. Written and committed BEFORE any sealed row was read. The test is run ONCE.
# Nothing in this file or in the code may change after the sealed data has been read. Every cell is reported, passing or not.
what_is_tested:
  models: "the serving bundle models/final_v1 EXACTLY as verified in Phase 10 (trained on development ponds, training + validation windows; md5/sha256 of every file recorded in its manifest)"
  bundle_manifest_sha256_must_match: true            # the run refuses to start if any file changed since Phase 10
  nothing_is_refit_tuned_or_selected_on_test: true
data:
  unseen_ponds_future:   # PRIMARY: the 4 sealed ponds, test window (ponds the models never saw, days after everything the models saw)
    role: unseen_pond_test
  seen_ponds_future:     # SECONDARY: the development ponds, test window (ponds the models saw, later days)
    role: seen_pond_test
  rows: "non-warm-up origins with a valid target and a valid current reading (as in all earlier phases)"
  dev_smoke_test: "the code is first exercised on dev_val rows (development data) to catch bugs; its numbers are NOT reported as results"
statistics: {bootstrap_B: 2000, seed: 20261113, level: 99, blocks: "pond x calendar day"}
forecast_cells:            # 9 cells = 3 targets x 3 distances, with the method the app uses (chosen from validation evidence in Phases 5b and 6)
  DO:   {15min: model, 1h: model, 6h: model}
  pH:   {15min: same_as_now, 1h: same_as_now, 6h: same_time_yesterday}
  Temp: {15min: same_as_now, 1h: model, 6h: model}
rules:
  F1_model_cells: "for each of the 5 model cells: pass if the lower end of the 99% interval of the improvement over BOTH 'same as now' AND 'same time yesterday' is > 0 on the sealed ponds"
  F2_simple_cells: "for the 4 simple-guess cells: report the error of the guess used and of the other guess; no pass/fail (no trained model is claimed there)"
  F3_headline: "report how many of the 5 model cells pass; do not call the forecasting 'validated' unless all 5 pass; say which ones failed"
  R1_ranges: "pooled coverage of the app's 'likely between' ranges on the sealed ponds in [0.87, 0.93]; conditional check: coverage >= 0.85 in day, night and low-value strata; report per cell"
  A1_alert_ranking: "per window (1 h, 3 h, 6 h): pass if the lower end of the 99% interval of (model AP minus each baseline AP) > 0 for ALL of: current level, trend extrapolation, same window yesterday"
  A2_alert_calibration: "per window: Brier score of the calibrated probabilities is below the raw one AND every reliability bin with n >= 100 is within 10 points"
  A3_alert_episodes: "6 h window, descriptive: the app's 'High chance' level (calibrated 31%); report episodes caught, median warning, false-alarm pond-days; baseline 'same window yesterday' at the strictest level matching the model's recall (favours the baseline)"
low_value_stratum: "target at or below the 10th percentile of the training targets of the bundle (development ponds, training + validation windows)"
reporting:
  - "all 9 forecast cells, 9 range cells, 3 alert windows reported with intervals, in full, whatever the outcome"
  - "compare with the validation-window numbers stored in the bundle manifest (descriptive); expect worse results because the test window is later and the sealed ponds are unseen"
  - "the app's evidence text and the model card must be updated to match the final test, including failures"
  - "one run only: a lock file records the start; a rerun after a crash is allowed only if no result file was written, and the report must disclose it"
  - "if the sealed test is negative for a cell, the cell stays negative; no retraining, no new thresholds, no excluded ponds"
out_of_scope: ["any retraining or tuning", "any change of rules", "using the sealed data for anything else", "salt-marsh sealed pond (Shark) and test window (separate, not run here)"]
