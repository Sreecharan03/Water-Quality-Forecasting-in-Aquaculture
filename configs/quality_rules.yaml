# Phase 2 quality rules. Changing any value changes the processed dataset version hash.
cleaning:
  zero_as_missing: true            # FWI documents exact zeros as equipment artifacts (not flagged by their QC)
  physical_bounds:                 # hard physical limits only; NOT a plausibility filter
    DO: [0.0, 30.0]                # mg/L
    pH: [0.0, 14.0]
    Temp: [0.0, 45.0]              # degC
  duplicate_policy: mask_conflicting_variables   # identical duplicates collapse; differing variables are masked
  timezone:
    name: IST
    utc_offset_minutes: 330        # fixed, no DST

grid:
  nominal_interval_min: 15
  grid_tolerance_min: 3

treatments:
  max_ffill_steps: 2               # 30 min; causal forward fill, evaluated as a treatment only
  critical_do_mgL: 1.0             # hypoxia threshold used to count retained critical events
  near_zero_do_mgL: 0.1
  origin_settings: [[24, 4], [24, 24]]   # (lookback steps, horizon steps)

calibration_check:
  event_date: "2026-01-08"
  pre_window: ["2026-01-05", "2026-01-08"]
  post_window: ["2026-01-10", "2026-01-13"]
  window_days: 3
  separation_days: 5
  min_points: 150
