name: tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies (same versions as the Modal image)
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1
          pip install pandas==2.2.3 numpy==2.1.3 pyyaml pytest pyarrow==18.1.0 matplotlib==3.9.2 scipy==1.14.1 scikit-learn==1.5.2 lightgbm==4.5.0 xgboost==2.1.3
      - name: Unit tests (synthetic fixtures only; no raw data, no secrets)
        run: python -m pytest -q tests
